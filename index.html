<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árvore Genealógica — Família Carvalho & Batista</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f1e8;--surface:#fffdf8;--ink:#2a2521;--muted:#6c6358;--line:#ddd3c2;--green:#3f6b4e;--green-d:#345a41;--green-l:#e6efe7}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:var(--ink);line-height:1.55;background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 80px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(246,241,232,.9);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:1rem;font-weight:600;margin:0}
.search{flex:1 1 200px;max-width:300px}
.search input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--surface);font:inherit;font-size:.9rem}
.btn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{height:36px;padding:0 12px;font-size:.8rem}
.hero{text-align:center;padding:30px 8px 10px}
.hero h2{font-size:1.8rem;margin:0 0 6px}
.hero p{color:var(--muted);max-width:560px;margin:0 auto;font-size:.9rem}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:100px}
.stat b{display:block;font-size:1.3rem;color:var(--green)}
.stat span{font-size:.7rem;color:var(--muted)}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:20px}
.section h3{margin:0 0 10px;font-size:1rem}
.tree{padding:4px 0}
ul.branch{list-style:none;margin:0;padding-left:22px;border-left:2px solid var(--line);margin-left:16px}
ul.branch.root{border-left:none;padding-left:0;margin-left:0}
li.node{position:relative;margin:4px 0}
.row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px}
.row:hover{background:#f0ebe0}
.twist{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;cursor:pointer;background:transparent;border:none;color:var(--muted);font-size:18px;line-height:1}
.twist.open{transform:rotate(90deg)}
.avatar{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:700;font-size:.7rem;flex-shrink:0}
.person{flex:1;text-align:left;background:none;border:none;font:inherit;cursor:pointer;color:var(--ink)}
.person .nm{font-weight:600;font-size:.9rem}
.person .mt{color:var(--muted);font-size:.75rem}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--surface);width:100%;max-width:500px;border-radius:16px 16px 0 0;max-height:90vh;overflow:auto;padding:20px}
.sheet h3{margin:0 0 12px;font-size:1.2rem}
.sheet input,.sheet textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:8px}
.sheet textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:.85rem;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.admin-only{display:none}
body.is-admin .admin-only{display:block}
@media(min-width:720px){.overlay{align-items:center}.sheet{border-radius:16px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><h1>🌳 Carvalho & Batista</h1></div>
    <div class="search"><input id="search" type="search" placeholder="Buscar…"></div>
    <span id="pendingChip" style="font-size:.8rem;color:var(--muted)"><span id="pendingCount">0</span> em análise</span>
    <button class="btn sm admin-only" id="btnQueue">Revisar</button>
    <button class="btn sm" id="btnAdmin">🔐</button>
  </div>
</header>
<div class="wrap">
  <section class="hero">
    <h2>Árvore Genealógica</h2>
    <p>Família Carvalho & Batista. Clique em qualquer nome para sugerir correções.</p>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <button class="btn sm" id="btnExpand">Expandir</button>
      <button class="btn sm" id="btnCollapse">Recolher</button>
    </div>
    <div id="loading" style="text-align:center;color:var(--muted);padding:10px">Carregando…</div>
  </section>
  <section class="section">
    <h3>Ascendência</h3>
    <div class="tree" id="ascTree"></div>
  </section>
  <section class="section">
    <h3>Descendência — 8 ramos</h3>
    <div class="tree" id="mainTree"></div>
  </section>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const SUPABASE_URL = "https://rleexhjpx1xhwqrbf1mp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsZWV4aGpweGl4aHdxcmJmbG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDAwOTksImV4cCI6MjEwMzA3NjA5OX0.O8rFa2XZJrNE29F6trjA_Sork2lmMMudzqa987lTxf4";
const ADMIN_PIN = "familia2026";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function P(n,c,m){return{name:n,meta:m||null,notes:[],children:c||[]}}

const SEED = {
  tree: P("Aires José de Carvalho & Rosa Batista", [
    P("Mª Amélia Carvalho & Armindo", [P("Mª Fernanda (Nina)", [P("com Afonso", [P("Bruno")], "união"), P("com Rogério", [P("Marília & Benjamim", [P("Cláudia & Ricardo", [P("Iara (& Bruno)"), P("Ivo")]), P("Liliana & Nuno", [P("João"), P("Paula")])]), P("Manuel & Ana", [P("Rogério & Claudia", [P("Gonçalo")])]), P("Hermínia Isolette")], "união")])], "Ramo 1"),
    P("Francisco Carvalho & Lourdes", [P("Carmo & Francisco", [P("Ana Francisca & Tom", [P("Diana")]), P("Francisco Aires"), P("Manuel Francisco")]), P("Edna", [P("com Armando", [P("Sónia & Tony", [P("Lourdinhas"), P("Kiko")]), P("Ana Paula & António Eugénio", [P("Daniela & Nani", [P("Lucas"), P("Catarina"), P("Beatriz")]), P("Paulo André & Melanie", [P("Leonardo"), P("Adriana"), P("Sienna")]), P("Marcos")]), P("Margarida (Guida) & Zé", [P("Zé & Maria", [P("António"), P("Eva")]), P("Margarida"), P("Sofia Margarida")]), P("Vanda & Marcos", [P("Diogo"), P("Dennis")])], "união"), P("com Ricardo", [P("Rafaela", [P("Filipe")])], "união")])], "Ramo 2"),
    P("Lucília Carvalho & Constantino", [P("Nelson & Mariazinha", [P("Solange & Tobi", [P("Rafael"), P("Lucky"), P("Aliej")]), P("Tommy"), P("Stephanie"), P("Nicolas")]), P("Leno"), P("Carlos Osvaldo & Manuela", [P("Susana Raquel")]), P("César", [P("Heliana")])], "Ramo 3"),
    P("Alice Carvalho & Armindo", [P("Fernando Hitler & Mª Teresa", [P("Vera", [P("Carlos Miguel"), P("Rodrigo"), P("Lucas")]), P("Fernando"), P("Aires")]), P("Elsa & Queirós", [P("Miguel"), P("Ivo & Ana Cristina", [P("Thelma"), P("Tomas")]), P("Nuno & Luísa", [P("Tiago")]), P("Hildeberto Jorge & Tânia")]), P("Sandra", [P("com Ângelo", [P("Ricardo César"), P("João Filipe"), P("Ângela & Tomás", [P("Guilherme")])], "união"), P("com Otelo", [P("Martim")], "união")])], "Ramo 4"),
    P("Mª Lourdes (Lurdes) Carvalho & Zé", [P("Célia & João Lemos", [P("Marina", [P("Maria Vitória")])]), P("Fernando"), P("Carla & Carlos", [P("Beatriz", [P("Daniel")]), P("Pedro")])], "Ramo 5"),
    P("Emília Carvalho & Mário", [P("Carlos Jorge & Patrícia")], "Ramo 6"),
    P("Fernando Edgar José de Carvalho & Maria Ana", [P("Ana Sofia Gonçalves de Carvalho & Rui", [P("Inês"), P("Gonçalo")]), P("Rui Edgar & Davi")], "Ramo 7"),
    P("Isabel Celeste Carvalho & Joaquim", [P("Vera Mónica & Adrian", [P("Lara"), P("Liam")]), P("Ana Cristina & Gonçalo", [P("Maria Rita")])], "Ramo 8")
  ], "Genearcas"),
  asc: [
    P("Linhagem Patrilinear — Pais de Aires", [], "Vila Nova de Famalicão, Portugal"),
    P("Linhagem Matrilinear — Pais de Rosa", [P("Pai de Rosa", [], "Transmontano, Portugal"), P("Mãe de Rosa", [], "Angolana")], "avós maternos"),
    P("Tios-Avós Paternos", [P("Amélia de Carvalho"), P("Irmão varão")])
  ]
};

let state = {data: null, pending: [], expanded: new Set(), isAdmin: false}, nById = {}, pId = {};

function assign(n, id) {
  n.id = id;
  if(!n.notes) n.notes = [];
  (n.children||[]).forEach((c, i) => assign(c, id+"."+i));
}

function rebuild() {
  nById = {};
  pId = {};
  const w = (n, pid) => {
    nById[n.id] = n;
    if(pid) pId[n.id] = pid;
    (n.children||[]).forEach(c => w(c, n.id));
  };
  w(state.data.tree, null);
  state.data.asc.forEach(n => w(n, null));
}

async function load() {
  try {
    const {data} = await sb.from("tree_data").select("tree_json").eq("id", 1).single();
    state.data = data?.tree_json || SEED;
  } catch(e) {
    state.data = SEED;
  }
  if(!state.data.tree.id) {
    assign(state.data.tree, "t");
    state.data.asc.forEach((n, i) => assign(n, "a"+i));
  }
  rebuild();
  state.pending = await sb.from("pending_suggestions").select("*").eq("status", "pending").then(r => r.data || []).catch(() => []);
  render();
}

async function save() {
  return sb.from("tree_data").update({tree_json: state.data, updated_at: new Date()}).eq("id", 1);
}

function toast(m, ok) {
  const t = document.getElementById("toast");
  t.textContent = m;
  t.className = "toast show" + (ok ? " ok" : "");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function esc(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function html(n) {
  const kids = n.children || [];
  const open = state.expanded.has(n.id);
  const hasK = kids.length > 0;
  let cH = "";
  if(hasK && open) {
    const i = kids.map(c => html(c)).join("");
    if(i) cH = '<ul class="branch">'+i+'</ul>';
  }
  const kind = n.id === "t" ? "kind-root" : (n.meta && /^Ramo/.test(n.meta) ? "kind-ramo" : (n.meta === "união" ? "kind-uniao" : ""));
  return '<li class="node '+kind+'"><div class="row"><button class="twist'+(open?" open":"")+'" data-act="toggle" data-id="'+n.id+'">›</button><span class="avatar">👤</span><button class="person" data-act="open" data-id="'+n.id+'"><span class="nm">'+esc(n.name)+'</span>'+(n.meta&&n.meta!=="união"?'<span class="mt">'+esc(n.meta)+'</span>':'')+'</button></div>'+cH+'</li>';
}

function render() {
  document.getElementById("mainTree").innerHTML = '<ul class="branch root">'+html(state.data.tree)+'</ul>';
  document.getElementById("ascTree").innerHTML = '<ul class="branch root">'+(state.data.asc.map(html).join(""))+'</ul>';
  document.getElementById("loading").style.display = "none";
  document.getElementById("pendingCount").textContent = state.pending.length;
}

function sheet(htm) {
  document.getElementById("sheet").innerHTML = htm;
  document.getElementById("overlay").classList.add("show");
}

function close() {
  document.getElementById("overlay").classList.remove("show");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
  
  if(act === "toggle") {
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
    render();
  } else if(act === "open") {
    const n = nById[id];
    sheet('<h3>'+esc(n.name)+'</h3><button class="btn primary" data-act="suggest-name" data-id="'+id+'">Sugerir nome</button><button class="btn" data-act="suggest-note" data-id="'+id+'">Observação</button>');
  } else if(act === "suggest-name") {
    sheet('<h3>Novo nome</h3><input id="nm" value="'+esc(nById[id].name)+'"><input id="au" placeholder="Seu nome"><button class="btn primary" data-act="submit-name" data-id="'+id+'">Enviar</button>');
  } else if(act === "suggest-note") {
    sheet('<h3>Observação</h3><textarea id="tx" placeholder="..."></textarea><input id="au" placeholder="Seu nome"><button class="btn primary" data-act="submit-note" data-id="'+id+'">Enviar</button>');
  } else if(act === "submit-name") {
    const nm = (document.getElementById("nm").value||"").trim(), au = (document.getElementById("au").value||"").trim();
    if(!nm) {toast("Escreva o nome"); return}
    sb.from("pending_suggestions").insert([{type:"rename", node_id:id, node_name:nById[id].name, proposed:nm, author:au||null, status:"pending"}]).then(() => {toast("Enviado"); close();}).catch(() => toast("Erro"));
  } else if(act === "submit-note") {
    const tx = (document.getElementById("tx").value||"").trim(), au = (document.getElementById("au").value||"").trim();
    if(!tx) {toast("Escreva a observação"); return}
    sb.from("pending_suggestions").insert([{type:"note", node_id:id, node_name:nById[id].name, text:tx, author:au||null, status:"pending"}]).then(() => {toast("Enviado"); close();}).catch(() => toast("Erro"));
  } else if(act === "close") {
    close();
  } else if(act === "login") {
    const p = (document.getElementById("pin").value||"").trim();
    if(p === ADMIN_PIN) {state.isAdmin = true; document.body.classList.add("is-admin"); close(); toast("Admin ativo"); render();} else toast("PIN errado");
  } else if(act === "queue") {
    sb.from("pending_suggestions").select("*").eq("status", "pending").then(r => {
      state.pending = r.data || [];
      let h = '<h3>Sugestões ('+state.pending.length+')</h3>';
      state.pending.forEach(it => {
        if(it.type === "rename") h += '<div style="background:#f0e8d8;padding:8px;margin:8px 0;border-radius:8px"><strong>'+esc(it.node_name)+'</strong> → <strong style="color:var(--green)">'+esc(it.proposed)+'</strong><div style="margin-top:6px"><button class="btn ok sm" data-act="approve" data-id="'+it.id+'">Aprovar</button> <button class="btn danger sm" data-act="reject" data-id="'+it.id+'">Rejeitar</button></div></div>';
        else h += '<div style="background:#f0e8d8;padding:8px;margin:8px 0;border-radius:8px"><strong>'+esc(it.node_name)+'</strong><p>'+esc(it.text)+'</p><button class="btn ok sm" data-act="approve" data-id="'+it.id+'">Aprovar</button> <button class="btn danger sm" data-act="reject" data-id="'+it.id+'">Rejeitar</button></div>';
      });
      sheet(h);
    });
  } else if(act === "approve") {
    const it = state.pending.find(x => x.id === id);
    if(!it) return;
    const n = nById[it.node_id];
    if(!n) {toast("Pessoa não existe"); return}
    if(it.type === "rename") n.name = it.proposed;
    else (n.notes = n.notes||[]).push({text:it.text, author:it.author||"", at:Date.now()});
    save().then(() => sb.from("pending_suggestions").update({status:"approved"}).eq("id", id)).then(() => {toast("Aprovado"); render(); close();}).catch(() => toast("Erro"));
  } else if(act === "reject") {
    sb.from("pending_suggestions").update({status:"rejected"}).eq("id", id).then(() => {toast("Rejeitado"); state.pending = state.pending.filter(x => x.id !== id); render();}).catch(() => toast("Erro"));
  }
});

document.getElementById("btnAdmin").addEventListener("click", () => {
  if(state.isAdmin) {state.isAdmin = false; document.body.classList.remove("is-admin"); close(); render();}
  else sheet('<h3>Admin</h3><input id="pin" type="password" placeholder="PIN familia2026"><button class="btn primary" data-act="login">Entrar</button>');
});

document.getElementById("btnQueue").addEventListener("click", () => {
  let h = '<h3>Sugestões</h3>';
  if(state.pending.length === 0) h += '<p style="color:var(--muted)">Nenhuma sugestão pendente</p>';
  sb.from("pending_suggestions").select("*").eq("status", "pending").then(r => {
    state.pending = r.data || [];
    let h = '<h3>Sugestões ('+state.pending.length+')</h3>';
    state.pending.forEach(it => {
      if(it.type === "rename") h += '<div style="background:#f0e8d8;padding:8px;margin:8px 0;border-radius:8px"><strong>'+esc(it.node_name)+'</strong> → <strong style="color:var(--green)">'+esc(it.proposed)+'</strong><div style="margin-top:6px"><button class="btn ok sm" data-act="approve" data-id="'+it.id+'">Aprovar</button> <button class="btn danger sm" data-act="reject" data-id="'+it.id+'">Rejeitar</button></div></div>';
      else h += '<div style="background:#f0e8d8;padding:8px;margin:8px 0;border-radius:8px"><strong>'+esc(it.node_name)+'</strong><p>'+esc(it.text)+'</p><button class="btn ok sm" data-act="approve" data-id="'+it.id+'">Aprovar</button> <button class="btn danger sm" data-act="reject" data-id="'+it.id+'">Rejeitar</button></div>';
    });
    sheet(h);
  });
});

document.getElementById("btnExpand").addEventListener("click", () => {
  Object.keys(nById).forEach(id => {if((nById[id].children||[]).length) state.expanded.add(id);});
  render();
});

document.getElementById("btnCollapse").addEventListener("click", () => {
  state.expanded = new Set();
  render();
});

document.getElementById("search").addEventListener("input", e => {
  render();
});

document.getElementById("overlay").addEventListener("click", e => {
  if(e.target === document.getElementById("overlay")) close();
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape") close();
});

load();
</script>
</body>
</html>
