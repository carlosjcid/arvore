<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carvalho & Batista — Árvore Genealógica</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sohne:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #fcfaf6;
  --card: #fff;
  --text-primary: #1a1310;
  --text-secondary: #5d524d;
  --text-tertiary: #8b8077;
  --border: #e8e1d8;
  --accent-warm: #c97f4e;
  --accent-cool: #4a7169;
  --accent-light: #f5eee5;
  --success: #3f8659;
  --danger: #c84d3d;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-xxl: 48px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(26,19,16,.08);
  --shadow-md: 0 4px 12px rgba(26,19,16,.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--text-primary);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== LAYOUT MOBILE-FIRST ===== */
.container { width: 100%; max-width: 100%; }
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: var(--space-lg) var(--space-md);
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
}
.header-brand {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  flex: 1;
  min-width: 0;
}
.header-brand-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--accent-cool), var(--accent-warm));
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 20px;
  flex-shrink: 0;
}
.header-brand h1 {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.3px;
  color: var(--text-primary);
}
.header-brand small {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 500;
  display: block;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.header-actions {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 32px;
  padding: 0 var(--space-md);
  border-radius: 999px;
  background: var(--accent-light);
  color: var(--accent-warm);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  min-height: 44px;
  padding: 0 var(--space-md);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--card);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  appearance: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent-cool);
  color: white;
  border-color: var(--accent-cool);
}
.btn.secondary {
  background: var(--accent-light);
  color: var(--accent-warm);
  border-color: transparent;
}
.btn.danger {
  background: #fce4e0;
  color: var(--danger);
  border-color: transparent;
}
.btn.sm {
  min-height: 36px;
  padding: 0 var(--space-md);
  font-size: 13px;
  border-radius: var(--radius-sm);
}
.btn.icon-only {
  width: 44px;
  padding: 0;
  border-radius: var(--radius-md);
}
.main {
  padding: var(--space-lg) var(--space-md);
  padding-bottom: var(--space-xxl);
}
.hero {
  margin-bottom: var(--space-xxl);
}
.hero-title {
  font-family: 'Sohne', serif;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.2;
  margin: 0 0 var(--space-md) 0;
  letter-spacing: -0.5px;
}
.hero-subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--space-md);
  margin-top: var(--space-lg);
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  text-align: center;
}
.stat-value {
  display: block;
  font-size: 24px;
  font-weight: 800;
  color: var(--accent-cool);
  line-height: 1;
  margin-bottom: var(--space-xs);
}
.stat-label {
  display: block;
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.toolbar {
  display: flex;
  gap: var(--space-sm);
  margin-top: var(--space-lg);
  flex-wrap: wrap;
}
.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: var(--space-lg);
  overflow: hidden;
}
.section-head {
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--space-md);
}
.section-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-warm);
  flex-shrink: 0;
}
.section-title {
  font-weight: 700;
  font-size: 16px;
  margin: 0;
  flex: 1;
}
.section-sub {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.section-body {
  padding: var(--space-md);
}
.tree { list-style: none; margin: 0; padding: 0; }
.tree-branch {
  list-style: none;
  margin: 0;
  padding: 0 0 0 20px;
  border-left: 2px solid var(--border);
}
.tree-branch.root {
  padding: 0;
  border: none;
}
.tree-item {
  position: relative;
  margin: 4px 0;
}
.tree-branch > .tree-item::before {
  content: "";
  position: absolute;
  top: 18px;
  left: -20px;
  width: 16px;
  height: 2px;
  background: var(--border);
}
.node-row {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-sm);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.15s;
}
.node-row:hover { background: var(--accent-light); }
.node-toggle {
  width: 24px;
  height: 24px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  border: none;
  background: none;
  color: var(--text-tertiary);
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.node-toggle.open { transform: rotate(90deg); }
.node-toggle.leaf { visibility: hidden; }
.node-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--accent-cool), var(--accent-warm));
  color: white;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.node-name {
  flex: 1;
  text-align: left;
  background: none;
  border: none;
  font: inherit;
  color: var(--text-primary);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  padding: 4px 0;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
}
.node-meta {
  display: block;
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
}
.node-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--accent-light);
  color: var(--accent-warm);
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.kind-root .node-row {
  background: linear-gradient(135deg, var(--accent-cool), #5a8375);
  color: white;
}
.kind-root .node-name {
  color: white;
}
.kind-root .node-meta {
  color: rgba(255,255,255,.7);
}
.kind-ramo .node-name {
  font-family: 'Sohne', serif;
  font-size: 15px;
}
.kind-ramo .node-row {
  background: var(--accent-light);
}
.kind-uniao .node-avatar {
  background: transparent;
  color: var(--accent-warm);
  border: 2px dashed var(--border);
}
.kind-uniao .node-name {
  font-style: italic;
  color: var(--text-secondary);
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(26,19,16,.5);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal.show {
  opacity: 1;
  pointer-events: auto;
}
.modal-sheet {
  background: var(--card);
  width: 100%;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: var(--space-lg);
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s;
}
@keyframes slideUp {
  from { transform: translateY(24px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-sheet h3 {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 var(--space-md) 0;
}
.modal-path {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: var(--space-lg);
}
.form-field {
  margin-bottom: var(--space-lg);
}
.form-field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: var(--space-sm);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.form-field input,
.form-field textarea {
  width: 100%;
  padding: var(--space-md);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font: inherit;
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg);
}
.form-field textarea {
  min-height: 100px;
  resize: vertical;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
.form-actions {
  display: flex;
  gap: var(--space-md);
}
.form-actions .btn {
  flex: 1;
}
.toast {
  position: fixed;
  bottom: var(--space-lg);
  left: var(--space-md);
  right: var(--space-md);
  z-index: 60;
  background: var(--text-primary);
  color: white;
  padding: var(--space-md) var(--space-lg);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: all 0.25s;
  box-shadow: var(--shadow-md);
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.toast.success {
  background: var(--success);
}
.admin-only { display: none; }
body.is-admin .admin-only { display: block; }

/* ===== TABLET & DESKTOP ===== */
@media (min-width: 640px) {
  .main { padding: var(--space-xxl) var(--space-lg); }
  .hero-title { font-size: 36px; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .modal {
    align-items: center;
    justify-content: center;
  }
  .modal-sheet {
    width: 100%;
    max-width: 500px;
    border-radius: var(--radius-lg);
    max-height: 90vh;
  }
  @keyframes slideUp {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
}

@media (max-width: 400px) {
  .header { padding: var(--space-md); }
  .header-brand h1 { font-size: 14px; }
  .hero-title { font-size: 24px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .btn.sm { min-height: 40px; }
  .modal-sheet { padding: var(--space-md); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-brand-icon">🌱</div>
    <div>
      <h1>Carvalho & Batista</h1>
      <small>Genealogia colaborativa</small>
    </div>
  </div>
  <div class="header-actions">
    <span class="badge" id="pendingBadge"><span id="pendingCount">0</span> análise</span>
    
    <a class="btn icon-only" href="admin.html" title="Admin" style="text-decoration:none">🔐</a>
  </div>
</header>

<main class="main">
  <section class="hero">
    <h2 class="hero-title">Árvore genealógica da família</h2>

    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <button class="btn sm secondary" id="btnExpand">Expandir tudo</button>
      <button class="btn sm secondary" id="btnCollapse">Recolher tudo</button>
      <button class="btn sm secondary" onclick="location.reload()">🔄 Atualizar</button>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <span class="section-dot"></span>
      <h3 class="section-title">Ascendência</h3>
      <span class="section-sub">Bisavós</span>
    </div>
    <div class="section-body">
      <ul class="tree" id="ascTree"></ul>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <span class="section-dot"></span>
      <h3 class="section-title">Descendência</h3>
      <span class="section-sub">8 ramos</span>
    </div>
    <div class="section-body">
      <ul class="tree" id="mainTree"></ul>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const ADMIN_PIN = "familia2026";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SEED = {tree:P("Aires José de Carvalho & Rosa Batista",[P("Mª Amélia Carvalho & Armindo",[P("Mª Fernanda (Nina)",[P("com Afonso",[P("Bruno")],"união"),P("com Rogério",[P("Marília & Benjamim",[P("Cláudia & Ricardo",[P("Iara (& Bruno)"),P("Ivo")]),P("Liliana & Nuno",[P("João"),P("Paula")])]),P("Manuel & Ana",[P("Rogério & Claudia",[P("Gonçalo")])]),P("Hermínia Isolette")],"união")])],"Ramo 1"),P("Francisco Carvalho & Lourdes",[P("Carmo & Francisco",[P("Ana Francisca & Tom",[P("Diana")]),P("Francisco Aires"),P("Manuel Francisco")]),P("Edna",[P("com Armando",[P("Sónia & Tony",[P("Lourdinhas"),P("Kiko")]),P("Ana Paula & António Eugénio",[P("Daniela & Nani",[P("Lucas"),P("Catarina"),P("Beatriz")]),P("Paulo André & Melanie",[P("Leonardo"),P("Adriana"),P("Sienna")]),P("Marcos")]),P("Margarida (Guida) & Zé",[P("Zé & Maria",[P("António"),P("Eva")]),P("Margarida"),P("Sofia Margarida")]),P("Vanda & Marcos",[P("Diogo"),P("Dennis")])],"união"),P("com Ricardo",[P("Rafaela",[P("Filipe")])],"união")])],"Ramo 2"),P("Lucília Carvalho & Constantino",[P("Nelson & Mariazinha",[P("Solange & Tobi",[P("Rafael"),P("Lucky"),P("Aliej")]),P("Tommy"),P("Stephanie"),P("Nicolas")]),P("Leno"),P("Carlos Osvaldo & Manuela",[P("Susana Raquel")]),P("César",[P("Heliana")])],"Ramo 3"),P("Alice Carvalho & Armindo",[P("Fernando Hitler & Mª Teresa",[P("Vera",[P("Carlos Miguel"),P("Rodrigo"),P("Lucas")]),P("Fernando"),P("Aires")]),P("Elsa & Queirós",[P("Miguel"),P("Ivo & Ana Cristina",[P("Thelma"),P("Tomas")]),P("Nuno & Luísa",[P("Tiago")]),P("Hildeberto Jorge & Tânia")]),P("Sandra",[P("com Ângelo",[P("Ricardo César"),P("João Filipe"),P("Ângela & Tomás",[P("Guilherme")])],"união"),P("com Otelo",[P("Martim")],"união")])],"Ramo 4"),P("Mª Lourdes (Lurdes) Carvalho & Zé",[P("Célia & João Lemos",[P("Marina",[P("Maria Vitória")])]),P("Fernando"),P("Carla & Carlos",[P("Beatriz",[P("Daniel")]),P("Pedro")])],"Ramo 5"),P("Emília Carvalho & Mário",[P("Carlos Jorge & Patrícia")],"Ramo 6"),P("Fernando Edgar José de Carvalho & Maria Ana",[P("Ana Sofia Gonçalves de Carvalho & Rui",[P("Inês"),P("Gonçalo")]),P("Rui Edgar & Davi")],"Ramo 7"),P("Isabel Celeste Carvalho & Joaquim",[P("Vera Mónica & Adrian",[P("Lara"),P("Liam")]),P("Ana Cristina & Gonçalo",[P("Maria Rita")])],"Ramo 8")],"Genearcas"),asc:[P("Linhagem Patrilinear — Pais de Aires",[],"Vila Nova de Famalicão"),P("Linhagem Matrilinear — Pais de Rosa",[P("Pai de Rosa",[],"Transmontano"),P("Mãe de Rosa",[],"Angolana")],"avós maternos"),P("Tios-Avós Paternos",[P("Amélia de Carvalho"),P("Irmão varão")])]};

function rebuild(){nById={};pId={};const w=(n,pid)=>{nById[n.id]=n;if(pid)pId[n.id]=pid;(n.children||[]).forEach(c=>w(c,n.id))};w(state.data.tree,null);state.data.asc.forEach(n=>w(n,null))}
async function load(){try{const{data}=await sb.from("tree_data").select("tree_json").eq("id",1).single();state.data=data?.tree_json||SEED}catch(e){state.data=SEED}if(!state.data.tree.id){assign(state.data.tree,"t");state.data.asc.forEach((n,i)=>assign(n,"a"+i))}rebuild();state.pending=await sb.from("pending_suggestions").select("*").eq("status","pending").then(r=>r.data||[]).catch(()=>[]);render()}
async function save(){return sb.from("tree_data").update({tree_json:state.data,updated_at:new Date()}).eq("id",1)}

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function html(n,depth=0){const kids=n.children||[];const open=state.expanded.has(n.id);const hasK=kids.length>0;let cH="";if(hasK&&open){const i=kids.map(c=>html(c,depth+1)).join("");if(i)cH='<ul class="tree-branch">'+i+'</ul>'}const kind=n.id==="t"?"kind-root":(n.meta&&/^Ramo/.test(n.meta)?"kind-ramo":(n.meta==="união"?"kind-uniao":""));const nb=(n.notes||[]).length?'<span class="node-badge">'+n.notes.length+'</span>':"";return'<li class="tree-item"><div class="node-row kind-'+kind+'"><button class="node-toggle'+(open?" open":"")+(hasK?"":" leaf")+'" data-act="toggle" data-id="'+n.id+'">›</button><span class="node-avatar">'+esc((n.name||"?").split(" ")[0][0].toUpperCase())+'</span><button class="node-name" data-act="open" data-id="'+n.id+'">'+esc(n.name)+(n.meta&&n.meta!=="união"?'<span class="node-meta">'+esc(n.meta)+'</span>':'')+'</button>'+nb+'</div>'+cH+'</li>'}
function render(){document.getElementById("mainTree").innerHTML='<ul class="tree tree-branch root">'+html(state.data.tree)+'</ul>';document.getElementById("ascTree").innerHTML='<ul class="tree tree-branch root">'+(state.data.asc.map(n=>html(n)).join(""))+'</ul>';document.getElementById("pendingCount").textContent=state.pending.length}
function sheet(htm){document.getElementById("modalSheet").innerHTML=htm;document.getElementById("modal").classList.add("show")}
function close(){document.getElementById("modal").classList.remove("show")}

document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const act=t.getAttribute("data-act"),id=t.getAttribute("data-id");if(act==="toggle"){state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render()}else if(act==="open"){const n=nById[id];sheet('<h3>'+esc(n.name)+'</h3><button class="btn primary" data-act="suggest-name" data-id="'+id+'">Sugerir nome</button><button class="btn secondary" data-act="suggest-note" data-id="'+id+'">Observação</button>')}else if(act==="suggest-name"){sheet('<h3>Novo nome</h3><div class="form-field"><input id="nm" value="'+esc(nById[id].name)+'"></div><div class="form-field"><input id="au" placeholder="Seu nome"></div><div class="form-actions"><button class="btn primary" data-act="submit-name" data-id="'+id+'">Enviar</button></div>')}else if(act==="suggest-note"){sheet('<h3>Observação</h3><div class="form-field"><textarea id="tx" placeholder="Datas, fotos, histórias..."></textarea></div><div class="form-field"><input id="au" placeholder="Seu nome"></div><div class="form-actions"><button class="btn primary" data-act="submit-note" data-id="'+id+'">Enviar</button></div>')}else if(act==="submit-name"){const nm=(document.getElementById("nm").value||"").trim(),au=(document.getElementById("au").value||"").trim();if(!nm){toast("Escreva o nome");return}sb.from("pending_suggestions").insert([{type:"rename",node_id:id,node_name:nById[id].name,proposed:nm,author:au||null,status:"pending"}]).then(()=>{toast("Enviado");close()}).catch(()=>toast("Erro"))}else if(act==="submit-note"){const tx=(document.getElementById("tx").value||"").trim(),au=(document.getElementById("au").value||"").trim();if(!tx){toast("Escreva a observação");return}sb.from("pending_suggestions").insert([{type:"note",node_id:id,node_name:nById[id].name,text:tx,author:au||null,status:"pending"}]).then(()=>{toast("Enviado");close()}).catch(()=>toast("Erro"))}else if(act==="close"){close()}else if(act==="login"){const p=(document.getElementById("pin").value||"").trim();if(p===ADMIN_PIN){state.isAdmin=true;document.body.classList.add("is-admin");close();toast("Admin ativo");render()}else toast("PIN errado")}else if(act==="queue"){sb.from("pending_suggestions").select("*").eq("status","pending").then(r=>{state.pending=r.data||[];let h='<h3>Sugestões ('+state.pending.length+')</h3>';state.pending.forEach(it=>{if(it.type==="rename")h+='<div style="background:var(--accent-light);padding:12px;margin:8px 0;border-radius:8px"><strong>'+esc(it.node_name)+'</strong> → <strong style="color:var(--accent-warm)">'+esc(it.proposed)+'</strong><div style="margin-top:8px;display:flex;gap:8px"><button class="btn primary sm" data-act="approve" data-id="'+it.id+'">Aprovar</button> <button class="btn danger sm" data-act="reject" data-id="'+it.id+'">Rejeitar</button></div></div>';else h+='<div style="background:var(--accent-light);padding:12px;margin:8px 0;border-radius:8px"><strong>'+esc(it.node_name)+'</strong><p style="margin:4px 0;font-size:13px">'+esc(it.text)+'</p><div style="display:flex;gap:8px"><button class="btn primary sm" data-act="approve" data-id="'+it.id+'">Aprovar</button> <button class="btn danger sm" data-act="reject" data-id="'+it.id+'">Rejeitar</button></div></div>'});sheet(h)})}else if(act==="approve"){const it=state.pending.find(x=>x.id===id);if(!it)return;const n=nById[it.node_id];if(!n){toast("Pessoa não existe");return}if(it.type==="rename")n.name=it.proposed;else(n.notes=n.notes||[]).push({text:it.text,author:it.author||"",at:Date.now()});save().then(()=>sb.from("pending_suggestions").update({status:"approved"}).eq("id",id)).then(()=>{toast("Aprovado");render();close()}).catch(()=>toast("Erro"))}else if(act==="reject"){sb.from("pending_suggestions").update({status:"rejected"}).eq("id",id).then(()=>{toast("Rejeitado");state.pending=state.pending.filter(x=>x.id!==id);render()}).catch(()=>toast("Erro"))}}); 

document.getElementById("btnExpand").addEventListener("click",()=>{Object.keys(nById).forEach(id=>{if((nById[id].children||[]).length)state.expanded.add(id)});render()});
document.getElementById("btnCollapse").addEventListener("click",()=>{state.expanded=new Set();render()});
document.getElementById("modal").addEventListener("click",e=>{if(e.target===document.getElementById("modal"))close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

load();
</script>

</body>
</html>
